name: No Claude lines

# Fails a pull request whose title, description, branch name, own commit messages or commit
# authors name Claude. Files are not checked, so CLAUDE.md and .claude/ stay as they are, and
# their names may appear in the text. A pull request about Claude itself can carry the label
# about-claude; tool attribution and session lines fail even then. Upstream commits keep their
# own attribution: a pull request that brings them carries the label upstream-commits, which
# skips the commits. No branch filter: it runs on pull requests into any branch of this fork,
# the kidou/slint-* branches among them. A new kidou/slint-* branch needs this file
# cherry-picked, since a pull request runs the workflows of its merge.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

concurrency:
  group: no-claude-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Title, description, branch and commits
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          ABOUT_CLAUDE: ${{ contains(github.event.pull_request.labels.*.name, 'about-claude') }}
          UPSTREAM: ${{ contains(github.event.pull_request.labels.*.name, 'upstream-commits') }}
        run: |
          commits=
          [ "$UPSTREAM" = "true" ] || commits=$(gh api "repos/$REPO/pulls/$PR/commits" --paginate \
            --jq '.[].commit | .message, "\(.author.name) <\(.author.email)>", "\(.committer.name) <\(.committer.email)>"')
          all=$(printf '%s\n%s\n%s\n%s\n' "$TITLE" "$BODY" "$BRANCH" "$commits")
          hard='co-authored-by:[[:space:]]*claude|generated (by|with) \[?claude|claude\.(ai|com)/|claude-session:|anthropic\.com>|^claude/'
          bad=$(printf '%s\n' "$all" | grep -inE "$hard" || true)
          if [ "$ABOUT_CLAUDE" != "true" ]; then
            soft=$(printf '%s\n' "$all" | sed -E 's#claude\.md|\.claude/##gI' | grep -in 'claude' || true)
            bad=$(printf '%s\n%s\n' "$bad" "$soft" | sort -u | sed '/^$/d')
          fi
          if [ -n "$bad" ]; then
            printf 'Remove these lines from the title, description, branch name or commit messages:\n%s\n' "$bad"
            exit 1
          fi
